# SciForge demo fixture — 实验结果曲线 spec
# 对应 docs/ARCHITECTURE.md §11 图表契约：sciforge.figures.plots.render_plot(spec, out)
# 用法：sciforge fig plot --spec examples/demo/fixtures/plot_spec.yaml -o figures/fig2_curves.pdf
#
# 数据来源：examples/demo/fixtures/results/metrics.json 的 training_curves 段。
# 三条曲线：DiT 基线 / 去掉路由的消融 / ATR-VDiT（本文方法）。
# 指标 FVD 越低越好；阴影为 3 个随机种子的 ±1 标准差。

kind: line
style: neurips
title: "Training convergence on UCF-101 (FVD ↓)"
xlabel: "Optimization steps (k)"
ylabel: "FVD ↓"
figsize: [3.25, 2.2]
legend: true
grid: false
colors: ["#8A95A3", "#E69F00", "#0072B2"]

series:
  - name: "DiT baseline"
    x: [10, 20, 40, 60, 80, 100]
    y: [412.5, 322.1, 278.4, 261.7, 254.3, 252.1]
    yerr: [22.4, 17.8, 12.6, 10.1, 8.7, 8.2]
    # 兼容 mean/std 命名的实现
    mean: [412.5, 322.1, 278.4, 261.7, 254.3, 252.1]
    std: [22.4, 17.8, 12.6, 10.1, 8.7, 8.2]
    color: "#8A95A3"
    linestyle: "--"
    marker: "o"

  - name: "Ours w/o router"
    x: [10, 20, 40, 60, 80, 100]
    y: [405.8, 315.2, 268.9, 251.4, 244.0, 241.7]
    yerr: [21.1, 16.4, 11.7, 9.4, 8.1, 7.6]
    mean: [405.8, 315.2, 268.9, 251.4, 244.0, 241.7]
    std: [21.1, 16.4, 11.7, 9.4, 8.1, 7.6]
    color: "#E69F00"
    linestyle: "-."
    marker: "s"

  - name: "ATR-VDiT (ours)"
    x: [10, 20, 40, 60, 80, 100]
    y: [400.2, 305.6, 258.9, 245.2, 239.6, 236.4]
    yerr: [19.8, 15.2, 10.4, 8.8, 7.5, 7.1]
    mean: [400.2, 305.6, 258.9, 245.2, 239.6, 236.4]
    std: [19.8, 15.2, 10.4, 8.8, 7.5, 7.1]
    color: "#0072B2"
    linestyle: "-"
    marker: "D"

annotations:
  - x: 60
    y: 245.2
    text: "−5.2% vs baseline"
    color: "#0072B2"
