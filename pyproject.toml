[project]
name = "sciforge"
version = "0.1.0"
description = "SciForge: 面向深度学习科研的本地智能体 Harness（文献→读论文→找创新点→实验→论文→顶会级配图），DeepSeek 驱动，可 SSH 调度 GPU 服务器。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SciForge Contributors" }]
keywords = ["scientific-agent", "deep-learning", "llm", "research", "harness", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "platformdirs>=4.2",
    "pypdf>=4.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
fig = ["matplotlib>=3.8", "cairosvg>=2.7"]
all = [
    "sciforge[pdf,web,fig]",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "matplotlib>=3.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
]

[project.scripts]
sciforge = "sciforge.cli:main"
sf = "sciforge.cli:main"

[project.urls]
Homepage = "https://github.com/sciforge/sciforge"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sciforge*"]

[tool.setuptools.package-data]
sciforge = [
    "prompts/*.md",
    "skills_lib/**/*.md",
    "skills_lib/**/*.yaml",
    "skills_lib/**/*.toml",
    "skills_lib/**/*.py",
    "templates/**/*",
    "figures/styles/*.mplstyle",
    "web/static/*",
    "catalog/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要真实网络的集成测试（默认跳过）",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.uv]
package = true
